{% extends "base.html" %}

{% block content %}

<!-- Carousel -->
<div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicators -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
    </div>

    <!-- Images -->
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://cdn.dribbble.com/userupload/45376910/file/28f23229f93ccaa57c71a9b39d52e09a.jpg?resize=752x&vertical=center"
                 class="d-block w-100"
                 style="height:650px;object-fit:cover;">
        </div>

        <div class="carousel-item">
            <img src="https://cdn.dribbble.com/userupload/45235071/file/2d279ede756d9630c6d1c8c35113c0aa.png?resize=752x&vertical=center"
                 class="d-block w-100"
                 style="height:650px;object-fit:cover;">
        </div>

        <div class="carousel-item">
            <video class="d-block w-100"
                   style="height:650px;object-fit:cover;"
                   autoplay muted loop>
                <source src="https://cdn.dribbble.com/userupload/10497266/file/original-00a8bfc04500bd5a8206ca3ace5503ca.mp4"
                        type="video/mp4">
            </video>
        </div>

    </div>

    <button class="carousel-control-prev" type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" type="button"
            data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

{% endblock %}
