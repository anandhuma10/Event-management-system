{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE EVENTS | Login & Signup</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

<div class="container">

    <div class="card auth-card">

        <div class="card-body">

            <!-- Logo -->
            <div class="text-center mb-4">

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSJunvnZZ6YkPnrhU6N5uZO8415elXeZepiG-Wh0WDxFg&s=10"
                     class="logo"
                     alt="EventEase">

                <h2 class="auth-title mt-3">LUXE EVENTS</h2>
                <p class="auth-subtitle">
                    Welcome! Login or create your account.
                </p>

            </div>

            <!-- Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Tabs -->
            <ul class="nav nav-pills nav-fill mb-4" id="pills-tab" role="tablist">

                <li class="nav-item">
                    <button class="nav-link active"
                            data-bs-toggle="pill"
                            data-bs-target="#login"
                            type="button">
                        Login
                    </button>
                </li>

                <li class="nav-item">
                    <button class="nav-link"
                            data-bs-toggle="pill"
                            data-bs-target="#signup"
                            type="button">
                        Sign Up
                    </button>
                </li>

            </ul>

            <div class="tab-content">

                <!-- LOGIN -->
                <div class="tab-pane fade show active" id="login">

                    <form method="POST">

                        {% csrf_token %}
                        <input type="hidden" name="action" value="login">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text"
                                class="form-control"
                                name="username"
                                placeholder="Choose a username"
                                required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   placeholder="Enter password"
                                   required>
                        </div>

                        <button class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                </div>

                <!-- SIGNUP -->
                <div class="tab-pane fade" id="signup">

                    <form method="POST">

                        {% csrf_token %}
                        <input type="hidden" name="action" value="register">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text"
                                class="form-control"
                                name="username"
                                placeholder="Choose a username"
                                required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">First name</label>
                        <input type="text" name="first_name" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Last name</label>
                        <input type="text" name="last_name" class="form-control" required>
                        </div>
                       
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   placeholder="Enter email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   placeholder="Create password"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <input type="password"
                                   class="form-control"
                                   name="confirmpassword"
                                   placeholder="Confirm password"
                                   required>
                        </div>

                        <button class="btn btn-success w-100">
                            Create Account
                        </button>

                    </form>

                </div>

            </div>

            <div class="text-center mt-4">
                <a href="{% url 'index' %}" class="back-home">
                    ← Back to Home
                </a>
            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
